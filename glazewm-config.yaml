# GlazeWM configuration snippet for App Launcher
# Add this to your ~/.glzr/glazewm/config.yaml

# =============================================================================
# KEYBINDING
# =============================================================================
# The launcher runs as a resident daemon. Running al.exe again while it's up
# sends a "toggle" command to the daemon via named pipe and exits.
#
# Call al.exe directly - don't wrap it in powershell or cmd. Console programs
# open a terminal window that steals focus, and the launcher hides itself
# when it loses focus.
#
# Replace the path with wherever al.exe lives.
keybindings:
  - commands: ["shell-exec C:\\path\\to\\app-launcher\\target\\release\\al.exe"]
    bindings: ["alt+a"]

# =============================================================================
# WINDOW RULES
# =============================================================================
# Make the launcher float and ignore tiling
window_rules:
  - commands: ["ignore"]
    match:
      - window_process: { equals: "al" }

# =============================================================================
# HOW IT WORKS
# =============================================================================
# 1. First Alt+A: al.exe starts as the resident daemon and shows the UI
# 2. Escape, launching an app, or focusing another window: UI hides
#    (minimizes), daemon stays resident
# 3. Next Alt+A: a second al.exe sends "toggle" via named pipe and exits;
#    the daemon shows the UI
# 4. No terminal flash, only one resident process
