[package]
name = "al"
version = "0.1.0"
edition = "2021"
description = "A modern application launcher for Windows with GlazeWM integration"

[dependencies]
# GUI Framework
iced = { version = "0.13", features = ["image", "svg", "tokio", "advanced"] }

# Windows transparency/blur effects
window-vibrancy = "0.5"

# Windows API bindings
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Security",
]}

# App discovery
dirs = "5.0"
walkdir = "2.5"
lnk = "0.5"

# Fuzzy search
fuzzy-matcher = "0.3"

# Time/Date handling
chrono = "0.4"

# Regex for name normalization
regex = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time"] }

# Serialization for caching
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Once cell for lazy statics
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

# Build as Windows GUI application (no console window)
[[bin]]
name = "al"
path = "src/main.rs"

[package.metadata.winresource]
# This makes it a Windows GUI app, not console
# Alternatively, add #![windows_subsystem = "windows"] to main.rs